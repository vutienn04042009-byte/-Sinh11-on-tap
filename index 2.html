<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập kiến thức Sinh học 11 - KTGK</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER: 60px */
        header {
            height: 60px;
            background: linear-gradient(180deg, #151515, #0a0a0a);
            border-bottom: 2px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 10;
        }
        .header-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffd700;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-tools {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .timer-box {
            font-size: 28px;
            font-weight: 900;
            background: #111;
            border: 2px solid #ff3333;
            color: #ff3333;
            border-radius: 8px;
            padding: 2px 16px;
            min-width: 80px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
            transition: all 0.3s ease;
        }
        .timer-box.warning {
            animation: pulse-red 0.5s infinite alternate;
            background: #330000;
        }
        @keyframes pulse-red {
            from { transform: scale(1); box-shadow: 0 0 10px #ff0000; }
            to { transform: scale(1.08); box-shadow: 0 0 25px #ff0000; }
        }

        .btn-header {
            background: #1a1a2e;
            color: #ffd700;
            border: 1px solid #ffd700;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-header:hover {
            background: #ffd700;
            color: #000;
        }
        .sound-toggle {
            cursor: pointer;
            font-size: 20px;
            padding: 4px 8px;
            background: #222;
            border-radius: 6px;
            border: 1px solid #555;
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: #ffd700 #111;
        }
        main::-webkit-scrollbar {
            width: 10px;
        }
        main::-webkit-scrollbar-track {
            background: #111;
        }
        main::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 5px;
        }

        /* Question Box: Blue dark, yellow border #ffd700, font 36px */
        .question-card {
            background: radial-gradient(circle at center, #002244 0%, #001122 100%);
            border: 3px solid #ffd700;
            border-radius: 16px;
            padding: 24px 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.25);
            min-height: 140px;
            display: flex;
            align-items: center;
        }
        .question-text {
            font-size: 34px;
            line-height: 1.35;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.8);
            width: 100%;
        }

        /* 2x2 Answer Grid, font 36px */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .answer-btn {
            background: linear-gradient(145deg, #141b29, #090e18);
            border: 2px solid #2a3b5c;
            border-radius: 14px;
            padding: 18px 24px;
            font-size: 32px;
            line-height: 1.3;
            color: #e0e8f5;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .answer-btn .prefix {
            color: #ffd700;
            font-weight: 900;
            flex-shrink: 0;
        }
        .answer-btn:hover {
            border-color: #ffd700;
            transform: translateY(-2px);
        }
        /* Clicked orange */
        .answer-btn.selected {
            background: linear-gradient(145deg, #e67e22, #d35400) !important;
            border-color: #ffaa00 !important;
            color: #fff !important;
            box-shadow: 0 0 20px rgba(230, 126, 34, 0.7) !important;
        }
        /* Reveal states */
        .answer-btn.correct-glow {
            background: linear-gradient(145deg, #107c41, #0b532b) !important;
            border-color: #00ff73 !important;
            color: #ffffff !important;
            animation: pulse-green 1s infinite alternate;
            box-shadow: 0 0 35px #00ff66, inset 0 0 15px #00ff66 !important;
            opacity: 1 !important;
        }
        .answer-btn.dimmed {
            opacity: 0.2 !important;
            filter: grayscale(80%);
            transform: scale(0.98);
        }

        @keyframes pulse-green {
            from { box-shadow: 0 0 15px #00ff66; }
            to { box-shadow: 0 0 35px #00ff88, 0 0 50px rgba(0,255,136,0.6); }
        }

        /* Explanation Box */
        .explanation-box {
            display: none;
            background: #0f1e17;
            border: 2px dashed #00ff73;
            border-radius: 12px;
            padding: 16px 24px;
            color: #adffd8;
            font-size: 22px;
            line-height: 1.45;
            box-shadow: 0 0 20px rgba(0, 255, 115, 0.15);
            animation: fadeIn 0.4s ease;
        }
        .explanation-box strong {
            color: #ffd700;
        }

        /* FOOTER: 60px, 4 buttons, font 18px */
        footer {
            height: 60px;
            background: #080808;
            border-top: 2px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 0 24px;
        }
        .btn-ctrl {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 10px 28px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-prev {
            background: #2b2d42;
            color: #edf2f4;
            border-color: #4a4e69;
        }
        .btn-prev:hover { background: #3d405b; }

        .btn-pause {
            background: #7f1d1d;
            color: #fee2e2;
            border-color: #ef4444;
        }
        .btn-pause:hover { background: #991b1b; }

        .btn-reveal {
            background: #b45309;
            color: #fef3c7;
            border-color: #f59e0b;
        }
        .btn-reveal:hover {
            background: #d97706;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
        }

        .btn-next {
            background: #14532d;
            color: #dcfce7;
            border-color: #22c55e;
        }
        .btn-next:hover {
            background: #16a34a;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }

        /* Welcome & End Screen */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #0c1220 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 30px;
            text-align: center;
        }
        .overlay-screen h1 {
            font-size: 50px;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 25px rgba(255,215,0,0.6);
        }
        .overlay-screen p {
            font-size: 24px;
            max-width: 800px;
            color: #ccc;
            margin-bottom: 35px;
            line-height: 1.5;
        }
        .btn-start {
            background: #ffd700;
            color: #000;
            font-size: 28px;
            font-weight: 900;
            padding: 16px 48px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            transition: all 0.2s;
        }
        .btn-start:hover {
            transform: scale(1.05);
            background: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }


        /* Responsive layout for phones */
        @media (max-width: 700px) {
            html, body { width: 100%; height: 100%; height: 100dvh; }
            body { overflow: hidden; }
            header {
                height: auto; min-height: 0; flex: 0 0 auto;
                padding: 8px 10px; gap: 8px; flex-wrap: wrap;
                justify-content: center;
            }
            .header-title {
                width: 100%; justify-content: space-between; gap: 6px;
                font-size: clamp(13px, 3.8vw, 18px); letter-spacing: 0;
            }
            .header-title span:first-child { min-width: 0; }
            #questionCounter { font-size: 13px !important; white-space: nowrap; }
            .header-tools { width: 100%; gap: 6px; justify-content: space-between; flex-wrap: wrap; }
            .btn-header { font-size: 11px; padding: 6px 7px; }
            .timer-box { font-size: 20px; min-width: 60px; padding: 2px 8px; }
            .sound-toggle { font-size: 12px; padding: 5px 6px; }
            main {
                min-height: 0; padding: 10px 10px 12px; gap: 12px;
                overflow-y: auto; -webkit-overflow-scrolling: touch;
            }
            .question-card { min-height: 0; padding: 14px 14px; border-width: 2px; border-radius: 12px; }
            .question-text { font-size: clamp(18px, 5vw, 24px); line-height: 1.3; overflow-wrap: anywhere; }
            .answers-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
            .answer-btn {
                width: 100%; min-width: 0; padding: 12px 13px; gap: 9px;
                font-size: clamp(16px, 4.2vw, 20px); line-height: 1.3;
                border-radius: 10px; overflow-wrap: anywhere;
            }
            .answer-btn .prefix { flex-shrink: 0; }
            .explanation-box { padding: 12px 14px; font-size: 16px; }
            footer {
                flex: 0 0 auto; height: auto; min-height: 0;
                display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 7px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
            }
            .btn-ctrl {
                width: 100%; min-width: 0; padding: 10px 5px;
                font-size: clamp(11px, 3.2vw, 14px); letter-spacing: 0;
                line-height: 1.15; white-space: normal; border-radius: 8px;
            }
            .overlay-screen { padding: 20px 14px; overflow-y: auto; }
            .overlay-screen h1 { font-size: clamp(24px, 7vw, 34px); }
            .overlay-screen p { font-size: 15px; line-height: 1.5; }
            .btn-start { font-size: 18px; padding: 13px 22px; }
        }

        @media (min-width: 701px) and (max-width: 1000px) {
            main { padding: 16px 20px; }
            .question-text { font-size: 28px; }
            .answer-btn { font-size: 24px; padding: 15px 18px; }
            footer { gap: 10px; padding: 0 12px; }
            .btn-ctrl { padding: 10px 14px; font-size: 15px; }
        }


        /* iPhone layout hardening: override desktop sizing on narrow screens */
        @media screen and (max-width: 700px) {
            html { width: 100% !important; min-height: 100% !important; }
            body {
                width: 100% !important;
                min-width: 0 !important;
                height: 100vh !important;
                height: 100dvh !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
            }
            header {
                width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                flex: 0 0 auto !important;
                padding: 7px 8px !important;
                gap: 6px !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
            }
            .header-title {
                width: 100% !important;
                min-width: 0 !important;
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
                gap: 5px !important;
                font-size: clamp(12px, 3.5vw, 16px) !important;
                letter-spacing: 0 !important;
                line-height: 1.15 !important;
            }
            .header-title span { min-width: 0 !important; overflow-wrap: anywhere !important; }
            #questionCounter { font-size: 12px !important; white-space: nowrap !important; }
            .header-tools {
                width: 100% !important;
                min-width: 0 !important;
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: space-between !important;
                align-items: center !important;
                gap: 5px !important;
            }
            .btn-header { max-width: 100% !important; font-size: 11px !important; padding: 5px 6px !important; }
            .timer-box { min-width: 0 !important; font-size: 19px !important; padding: 2px 7px !important; }
            .sound-toggle { font-size: 12px !important; padding: 4px 5px !important; }
            main {
                width: 100% !important;
                min-width: 0 !important;
                min-height: 0 !important;
                flex: 1 1 auto !important;
                overflow-x: hidden !important;
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch !important;
                padding: 10px 10px 14px !important;
                gap: 10px !important;
            }
            .question-card {
                width: 100% !important;
                min-width: 0 !important;
                min-height: 0 !important;
                padding: 12px !important;
                border-width: 2px !important;
                border-radius: 12px !important;
            }
            .question-text {
                width: 100% !important;
                min-width: 0 !important;
                font-size: clamp(17px, 4.8vw, 22px) !important;
                line-height: 1.28 !important;
                overflow-wrap: anywhere !important;
                word-break: normal !important;
            }
            .answers-grid {
                width: 100% !important;
                min-width: 0 !important;
                display: grid !important;
                grid-template-columns: minmax(0, 1fr) !important;
                gap: 9px !important;
            }
            .answer-btn {
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
                display: flex !important;
                align-items: flex-start !important;
                gap: 8px !important;
                padding: 11px 12px !important;
                font-size: clamp(15px, 4.1vw, 19px) !important;
                line-height: 1.3 !important;
                text-align: left !important;
                white-space: normal !important;
                overflow-wrap: anywhere !important;
                word-break: normal !important;
            }
            .answer-btn .prefix { flex: 0 0 auto !important; }
            .explanation-box { font-size: 15px !important; line-height: 1.4 !important; padding: 11px 12px !important; }
            footer {
                width: 100% !important;
                flex: 0 0 auto !important;
                height: auto !important;
                min-height: 0 !important;
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 6px !important;
                padding: 7px 9px calc(7px + env(safe-area-inset-bottom)) !important;
            }
            .btn-ctrl {
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
                padding: 9px 4px !important;
                font-size: clamp(10px, 3.1vw, 13px) !important;
                line-height: 1.15 !important;
                letter-spacing: 0 !important;
                white-space: normal !important;
                overflow-wrap: anywhere !important;
            }
            .overlay-screen { width: 100% !important; height: 100% !important; padding: 18px 14px !important; overflow-y: auto !important; }
            .overlay-screen h1 { font-size: clamp(23px, 7vw, 32px) !important; line-height: 1.2 !important; }
            .overlay-screen p { font-size: 15px !important; line-height: 1.45 !important; }
            .btn-start { font-size: 17px !important; padding: 12px 20px !important; }
        }

    </style>
</head>
<body>

    <!-- START / INTRO SCREEN -->
    <div id="introScreen" class="overlay-screen">
        <h1>ÔN TẬP KIẾN THỨC SINH HỌC 11 - KTGK</h1>
        <p>Hệ thống trò chơi điều phối lớp học kịch tính & chuẩn kiến thức GDPT 2018.<br>
           35 câu hỏi then chốt: Chuyển hóa vật chất & năng lượng, Quang hợp, Hô hấp ở thực vật.</p>
        <button class="btn-start" onclick="startGame()">BẮT ĐẦU TIẾT HỌC</button>
    </div>

    <!-- HEADER: 60px -->
    <header>
        <div class="header-title">
            <span>🌿 SINH HỌC 11 - KTGK</span>
            <span id="questionCounter" style="color: #00ff73; font-size: 20px;">[CÂU 1/35]</span>
        </div>
        <div class="header-tools">
            <button class="btn-header" onclick="shuffleCurrentOrder()">🔀 Đảo toàn bộ câu hỏi</button>
            <div id="timerDisplay" class="timer-box">30s</div>
            <button id="soundBtn" class="sound-toggle" onclick="toggleBGM()" title="Bật/Tắt Nhạc Nền">🔊 Nhạc</button>
            <button class="btn-header" onclick="goToMenu()">🏠 Menu</button>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main>
        <div class="question-card">
            <div class="question-text" id="questionContent">Đang tải câu hỏi...</div>
        </div>

        <div class="answers-grid" id="answersContainer">
            <!-- 4 Options dynamically injected -->
        </div>

        <div class="explanation-box" id="explanationContent">
            <!-- Teacher Explanation injected -->
        </div>
    </main>

    <!-- FOOTER: 60px -->
    <footer>
        <button class="btn-ctrl btn-prev" onclick="prevQuestion()">⬅ CÂU TRƯỚC</button>
        <button class="btn-ctrl btn-pause" id="btnPause" onclick="togglePause()">⏸ DỪNG</button>
        <button class="btn-ctrl btn-reveal" id="btnReveal" onclick="revealAnswer()">💡 HIỆN ĐÁP ÁN</button>
        <button class="btn-ctrl btn-next" onclick="nextQuestion()">TIẾP TỤC ➡</button>
    </footer>

    <script>
        /* ================= 35 CÂU HỎI TRẮC NGHIỆM ĐÃ ĐƯỢC CHỌN LỌC & GIẢI THÍCH CHUYÊN SÂU ================= */
        const originalQuestions = [
            {
                q: "Ở sinh vật tự dưỡng, nguồn năng lượng sơ cấp cung cấp cho quá trình chuyển hóa vật chất và năng lượng được lấy từ",
                options: [
                    "các hợp chất hữu cơ có sẵn trong môi trường.",
                    "ánh sáng mặt trời hoặc năng lượng từ các phản ứng hóa học.",
                    "nguồn nhiệt năng tích lũy trong môi trường đất.",
                    "năng lượng ATP tạo ra từ quá trình phân giải tế bào."
                ],
                correct: 1, // B
                explain: "Sinh vật tự dưỡng gồm quang tự dưỡng (dùng năng lượng ánh sáng) và hóa tự dưỡng (sử dụng năng lượng từ phản ứng oxy hóa các hợp chất vô cơ)."
            },
            {
                q: "Quá trình nào sau đây biểu hiện của sự trao đổi chất và chuyển hóa năng lượng ở cấp độ tế bào?",
                options: [
                    "Lông hút của rễ hấp thụ nước và muối khoáng từ đất.",
                    "Hệ tuần hoàn vận chuyển chất dinh dưỡng đến các mô.",
                    "Tế bào đồng hóa các chất để xây dựng cấu trúc và dị hóa để giải phóng năng lượng.",
                    "Thận lọc và bài tiết các chất cặn bã từ máu ra ngoài."
                ],
                correct: 2, // C
                explain: "Đồng hóa và dị hóa diễn ra trực tiếp bên trong tế bào là bản chất cốt lõi của chuyển hóa vật chất và năng lượng ở cấp độ tế bào."
            },
            {
                q: "Khi nói về các phương thức trao đổi chất và chuyển hóa năng lượng ở sinh giới, phát biểu nào sau đây đúng?",
                options: [
                    "Tất cả các loài vi khuẩn đều thuộc nhóm sinh vật hóa tự dưỡng.",
                    "Sinh vật dị dưỡng có khả năng tự tổng hợp chất hữu cơ từ các chất vô cơ ban đầu.",
                    "Sinh vật tự dưỡng tổng hợp chất hữu cơ bằng cách sử dụng nguồn carbon chủ yếu là CO2.",
                    "Động vật ăn thực vật thuộc nhóm sinh vật quang tự dưỡng vì chúng lấy năng lượng từ thực vật."
                ],
                correct: 2, // C
                explain: "Sinh vật tự dưỡng (quang tự dưỡng và hóa tự dưỡng) đều có khả năng đồng hóa nguồn carbon vô cơ chủ yếu là CO2 để tổng hợp chất hữu cơ."
            },
            {
                q: "Khi tế bào hình hạt đậu của khí khổng hút đầy nước, hiện tượng nào sau đây sẽ xảy ra?",
                options: [
                    "Thành dày căng ra kéo theo thành mỏng co lại làm khí khổng đóng kín.",
                    "Thành mỏng căng phồng ra làm cho thành dày cong theo và khí khổng mở ra.",
                    "Cả thành mỏng và thành dày đều co lại đột ngột khiến khí khổng đóng một nửa.",
                    "Thành dày duỗi thẳng ra làm cho thành mỏng ép chặt lại và khí khổng mở ra."

                q: "Sơ đồ các giai đoạn chính của quá trình hô hấp hiếu khí ở thực vật diễn ra theo trình tự nào?",
                options: [
                    "Chu trình Krebs -> Đường phân -> Chuỗi truyền electron hô hấp.",
                    "Đường phân -> Chu trình Krebs -> Chuỗi truyền electron hô hấp.",
                    "Chuỗi truyền electron hô hấp -> Đường phân -> Chuỗi Krebs.",
                    "Đường phân -> Lên men rượu -> Chu trình Krebs."
                ],
                correct: 1, // B
                explain: "Quá trình hô hấp hiếu khí diễn ra tuần tự qua: 1. Đường phân (bào tương) -> 2. Chu trình Krebs (chất nền ti thể) -> 3. Chuỗi truyền electron (màng trong ti thể)."
            },
            {
                q: "Giai đoạn đường phân của quá trình hô hấp tế bào diễn ra tại vị trí nào?",
                options: [
                    "Tế bào chất (bào tương).",
                    "Chất nền của ti thể.",
                    "Màng trong ti thể.",
                    "Màng thylakoid."
                ],
                correct: 0, // A
                explain: "Đường phân phân giải Glucose thành 2 phân tử Pyruvate diễn ra ngay trong tế bào chất mà không cần sự tham gia của ti thể hay khí oxy."
            },
            {
                q: "Vai trò quan trọng nhất của quá trình hô hấp đối với các hoạt động sống của chính cơ thể thực vật là",
                options: [
                    "Tạo ra oxy cung cấp cho khí quyển.",
                    "Tạo năng lượng dưới dạng ATP cung cấp cho mọi hoạt động sống và nhiệt năng duy trì nhiệt độ cơ thể.",
                    "Phân hủy hoàn toàn độc tố sinh ra trong tế bào.",
                    "Hấp thụ nước mạnh mẽ từ môi trường."
                ],
                correct: 1, // B
                explain: "ATP được giải phóng từ hô hấp cung cấp động lực cho vận chuyển chủ động, trao đổi chất, phân chia tế bào và sinh trưởng của thực vật."
            },
            {
                q: "Trong điều kiện thiếu oxy (ví dụ rễ cây bị ngập úng kéo dài), thực vật sẽ chuyển sang con đường hô hấp nào?",
                options: [
                    "Hô hấp hiếu khí mạnh mẽ.",
                    "Phân giải kị khí (đường phân và lên men).",
                    "Quang hô hấp tại lục lạp.",
                    "Ngừng hoàn toàn mọi sự phân giải chất hữu cơ."
                ],
                correct: 1, // B
                explain: "Khi thiếu O2, chuỗi truyền electron ngừng trệ, tế bào thực vật chuyển sang phân giải kị khí (lên men rượu ethanol hoặc lactic) sinh ít năng lượng và dễ tích độc."
            },
            {
                q: "Vì sao khi hàm lượng nước trong các loại hạt (như ngô, thóc) giảm xuống mức rất thấp (hạt khô) thì thời gian bảo quản lại kéo dài?",
                options: [
                    "Nước thấp làm tăng cường độ hô hấp của hạt.",
                    "Nước thấp ức chế tối đa hoạt động hô hấp tế bào của hạt, giúp hạt rơi vào trạng thái ngủ tiềm sinh và tránh tiêu hao chất hữu cơ.",
                    "Hạt khô dễ bị vi khuẩn xâm nhập tiêu hủy chất hữu cơ tốt hơn.",
                    "Thiếu nước khiến hạt không thể trao đổi khí hữu cơ với bên ngoài."
                ],
                correct: 1, // B
                explain: "Nước là dung môi và tham gia trực tiếp vào phản ứng enzym. Giảm hàm lượng nước đưa hạt vào trạng thái sống tiềm sinh giúp bảo quản hạt lâu dài."
            },
            {
                q: "Nồng độ khí nào sau đây nếu tăng cao trong môi trường lưu trữ nông sản sẽ có tác dụng ức chế hô hấp tế bào, giúp kéo dài thời gian bảo quản?",
                options: [
                    "Khí Oxy (O2).",
                    "Khí Carbon dioxide (CO2).",
                    "Khí Nitrogen (N2).",
                    "Khí Hydrogen (H2)."
                ],
                correct: 1, // B
                explain: "CO2 là sản phẩm cuối cùng của quá trình hô hấp. Khi nồng độ CO2 cao sẽ gây ức chế ngược đến các phản ứng enzym giải phóng khí này."
            }
        ];

        /* ================= GAME LOGIC & AUDIO ENGINE ================= */
        let questions = JSON.parse(JSON.stringify(originalQuestions));
        let currentIndex = 0;
        let timeLeft = 30;
        let timerInterval = null;
        let isPaused = false;
        let isRevealed = false;
        let selectedOptionIdx = null;

        // WEB AUDIO API - TẠO NHẠC NỀN & ÂM HIỆU CHUẨN OFFLINE 100%
        let audioCtx = null;
        let bgmGain = null;
        let bgmInterval = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                bgmGain = audioCtx.createGain();
                bgmGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                bgmGain.connect(audioCtx.destination);
                startDramaticBGM();
            }
        }

        // Nhạc nền kịch tính tổng hợp theo nhịp đập suspense (không cần internet tải file)
        function startDramaticBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            let beat = 0;
            const bassNotes = [55, 55, 65, 50]; // Tần số âm trầm (A1, A1, C2, G1)
            
            bgmInterval = setInterval(() => {
                if (isMuted || !audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    
                    osc.type = (beat % 2 === 0) ? 'sawtooth' : 'triangle';
                    const freq = bassNotes[beat % bassNotes.length];
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    noteGain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

                    osc.connect(noteGain);
                    noteGain.connect(bgmGain);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.45);
                    beat++;
                } catch(e) {}
            }, 600); // 100 BPM
        }

        function playTickSound() {
            if (isMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Âm tít cao 880Hz
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function playCorrectSound() {
            if (isMuted || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => { // C major chord
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.45);
                });
            } catch(e) {}
        }

        function toggleBGM() {
            isMuted = !isMuted;
            const btn = document.getElementById('soundBtn');
            btn.textContent = isMuted ? '🔇 Tắt' : '🔊 Nhạc';
            if (bgmGain) {
                bgmGain.gain.setValueAtTime(isMuted ? 0 : 0.08, audioCtx.currentTime);
            }
        }

        /* ================= GAME CONTROL LOGIC ================= */

        function startGame() {
            document.getElementById('introScreen').style.display = 'none';
            initAudio();
            loadQuestion(0);
        }

        function goToMenu() {
            if (confirm("Thầy/Cô có muốn quay về màn hình Giới thiệu?")) {
                clearInterval(timerInterval);
                document.getElementById('introScreen').style.display = 'flex';
            }
        }

        function loadQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            currentIndex = index;
            isRevealed = false;
            selectedOptionIdx = null;

            // Update Header Counter
            document.getElementById('questionCounter').textContent = `[CÂU ${currentIndex + 1}/${questions.length}]`;

            // Reset UI
            const q = questions[currentIndex];
            document.getElementById('questionContent').textContent = `Câu ${currentIndex + 1}: ${q.q}`;
            
            // Build Answer Grid (A, B, C, D)
            const letters = ['A', 'B', 'C', 'D'];
            const container = document.getElementById('answersContainer');
            container.innerHTML = '';

            q.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.id = `opt-${idx}`;
                btn.innerHTML = `<span class="prefix">${letters[idx]}.</span> <span>${optText}</span>`;
                btn.onclick = () => selectOption(idx);
                container.appendChild(btn);
            });

            // Hide explanation
            const expBox = document.getElementById('explanationContent');
            expBox.style.display = 'none';
            expBox.innerHTML = `<strong>💡 GIẢI THÍCH CHI TIẾT (GV):</strong> ${q.explain}`;

            // Reset and start timer (30s)
            resetTimer();
        }

        function selectOption(index) {
            if (isRevealed) return; // Prevent changing after reveal
            selectedOptionIdx = index;
            // Highlight selected button with orange color
            document.querySelectorAll('.answer-btn').forEach((btn, i) => {
                btn.classList.toggle('selected', i === index);
            });
        }

        function revealAnswer() {
            if (isRevealed) return;
            isRevealed = true;
            clearInterval(timerInterval);

            const q = questions[currentIndex];
            const correctIdx = q.correct;

            // Update button styles
            document.querySelectorAll('.answer-btn').forEach((btn, idx) => {
                if (idx === correctIdx) {
                    btn.classList.remove('selected');
                    btn.classList.add('correct-glow');
                } else {
                    btn.classList.add('dimmed');
                }
            });

            // Show explanation
            document.getElementById('explanationContent').style.display = 'block';

            // Play correct chime
            playCorrectSound();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            isPaused = false;
            updateTimerDisplay();
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    updateTimerDisplay();

                    if (timeLeft <= 5 && timeLeft > 0) {
                        playTickSound();
                    }

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timeLeft = 0;
                        updateTimerDisplay();
                        // When time runs out, auto reveal
                        revealAnswer();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timerDisplay');
            timerEl.textContent = `${timeLeft}s`;
            if (timeLeft <= 5 && timeLeft > 0) {
                timerEl.classList.add('warning');
            } else {
                timerEl.classList.remove('warning');
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('btnPause');
            if (isPaused) {
                btn.textContent = '▶ TIẾP TỤC ĐẾM';
                btn.style.background = '#0284c7';
                btn.style.borderColor = '#38bdf8';
            } else {
                btn.textContent = '⏸ DỪNG';
                btn.style.background = '#7f1d1d';
                btn.style.borderColor = '#ef4444';
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                alert("Chúc mừng Thầy/Cô và các em học sinh đã hoàn thành 35 câu hỏi ôn tập KTGK!");
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        // ĐẢO TOÀN BỘ CÂU HỎI (Fisher-Yates Shuffle cho danh sách câu hỏi)
        function shuffleCurrentOrder() {
            if (confirm("Thầy/Cô có chắc chắn muốn xáo trộn ngẫu nhiên thứ tự toàn bộ câu hỏi?")) {
                for (let i = questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questions[i], questions[j]] = [questions[j], questions[i]];
                }
                loadQuestion(0);
            }
        }

        // Bàn phím tắt hỗ trợ giáo viên điều phối sân khấu nhanh
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePause();
            } else if (e.code === 'Enter') {
                e.preventDefault();
                revealAnswer();
            } else if (e.code === 'ArrowRight') {
                nextQuestion();
            } else if (e.code === 'ArrowLeft') {
                prevQuestion();
            } else if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
                selectOption(parseInt(e.key) - 1);
            }
        });
    </script>
